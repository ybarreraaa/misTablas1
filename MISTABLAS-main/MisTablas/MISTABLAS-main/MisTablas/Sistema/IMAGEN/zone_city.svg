<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <linearGradient id="citySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="cityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#7c3aed" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="184" height="144" rx="28" fill="url(#citySky)" stroke="#a855f7" stroke-width="4" filter="url(#cityGlow)"/>
  
  <!-- Neon Skyline Buildings -->
  <rect x="25" y="65" width="28" height="60" rx="4" fill="#6d28d9"/>
  <rect x="30" y="75" width="6" height="8" fill="#fde047"/>
  <rect x="42" y="75" width="6" height="8" fill="#fde047"/>
  <rect x="30" y="90" width="6" height="8" fill="#38bdf8"/>
  <rect x="42" y="90" width="6" height="8" fill="#38bdf8"/>

  <rect x="60" y="45" width="35" height="80" rx="4" fill="#4c1d95"/>
  <rect x="66" y="55" width="8" height="10" fill="#fde047"/>
  <rect x="80" y="55" width="8" height="10" fill="#fde047"/>
  <rect x="66" y="72" width="8" height="10" fill="#38bdf8"/>
  <rect x="80" y="72" width="8" height="10" fill="#fde047"/>

  <rect x="105" y="55" width="30" height="70" rx="4" fill="#5b21b6"/>
  <rect x="145" y="70" width="30" height="55" rx="4" fill="#7c3aed"/>

  <!-- Lightning Bolt Tower -->
  <polygon points="120,25 132,45 124,47 135,62 118,52 124,49" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>

  <!-- Zone Title Badge -->
  <rect x="20" y="112" width="160" height="28" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="100" y="131" font-family="'Fredoka', sans-serif" font-weight="900" font-size="11.5" fill="#5b21b6" text-anchor="middle">
    CIUDAD ELÉCTRICA DEL 8 Y 9
  </text>
</svg>
