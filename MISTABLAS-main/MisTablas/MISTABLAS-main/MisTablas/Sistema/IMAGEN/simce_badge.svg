<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- SIMCE Shield / Badge -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Shield outline -->
  <path d="M50,8 L84,20 C84,54 70,78 50,92 C30,78 16,54 16,20 Z" fill="url(#shieldGrad)" stroke="#facc15" stroke-width="4" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.25))"/>
  <!-- Inner ribbon / banner -->
  <path d="M26,38 L74,38 L70,58 L50,66 L30,58 Z" fill="#ffffff" opacity="0.15"/>
  <!-- Big Checkmark & Pencil -->
  <path d="M34,48 L44,60 L68,34" fill="none" stroke="#facc15" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text -->
  <text x="50" y="82" fill="#ffffff" font-family="'Fredoka', 'Quicksand', 'Nunito', sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">SIMCE</text>
  <text x="50" y="28" fill="#facc15" font-family="'Quicksand', 'Nunito', sans-serif" font-weight="800" font-size="10" text-anchor="middle">4° BÁSICO</text>
</svg>
