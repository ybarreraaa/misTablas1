<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <radialGradient id="chispaBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ca8a04" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Aura Glow Circle -->
  <circle cx="70" cy="70" r="62" fill="#fef9c3" opacity="0.8"/>
  <circle cx="70" cy="70" r="56" fill="#fef08a" opacity="0.5"/>

  <!-- Lightning Tail -->
  <polygon points="105,95 125,75 115,75 130,50 108,62 116,62 98,85" fill="#f59e0b" filter="url(#softGlow)"/>

  <!-- Big Round Ears with Inner Color -->
  <circle cx="40" cy="38" r="22" fill="#facc15" stroke="#ca8a04" stroke-width="2.5"/>
  <circle cx="40" cy="38" r="14" fill="#fb7185"/>

  <circle cx="100" cy="38" r="22" fill="#facc15" stroke="#ca8a04" stroke-width="2.5"/>
  <circle cx="100" cy="38" r="14" fill="#fb7185"/>

  <!-- Chubby Body/Head -->
  <ellipse cx="70" cy="80" rx="42" ry="38" fill="url(#chispaBg)" stroke="#ca8a04" stroke-width="3" filter="url(#softGlow)"/>

  <!-- Rosy Cute Cheeks -->
  <circle cx="45" cy="85" r="9" fill="#f43f5e" opacity="0.85"/>
  <circle cx="95" cy="85" r="9" fill="#f43f5e" opacity="0.85"/>

  <!-- Big Shiny Anime Eyes -->
  <ellipse cx="54" cy="72" rx="7.5" ry="9" fill="#1e1b4b"/>
  <circle cx="56" cy="69" r="3.5" fill="#ffffff"/>
  <circle cx="52" cy="75" r="1.5" fill="#ffffff"/>

  <ellipse cx="86" cy="72" rx="7.5" ry="9" fill="#1e1b4b"/>
  <circle cx="88" cy="69" r="3.5" fill="#ffffff"/>
  <circle cx="84" cy="75" r="1.5" fill="#ffffff"/>

  <!-- Tiny Cute Nose -->
  <polygon points="70,78 68,76 72,76" fill="#78350f"/>

  <!-- Happy Open Smile -->
  <path d="M64,82 Q70,90 76,82" fill="#dc2626" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Little Paws holding a cute pencil -->
  <ellipse cx="50" cy="98" rx="8" ry="7" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
  <ellipse cx="90" cy="98" rx="8" ry="7" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>

  <!-- Cute Blue Pencil -->
  <g transform="translate(62, 88) rotate(-25)">
    <rect x="0" y="0" width="8" height="24" rx="2" fill="#38bdf8"/>
    <polygon points="0,24 8,24 4,32" fill="#fef08a"/>
    <polygon points="2,28 6,28 4,32" fill="#0f172a"/>
    <rect x="0" y="0" width="8" height="5" fill="#f472b6"/>
  </g>

  <!-- Sparkles -->
  <polygon points="24,20 27,27 34,30 27,33 24,40 21,33 14,30 21,27" fill="#f59e0b"/>
  <polygon points="120,24 122,29 127,31 122,33 120,38 118,33 113,31 118,29" fill="#f59e0b"/>
</svg>
