<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="coinGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#a16207" flood-opacity="0.3"/>
    </filter>
  </defs>
  <circle cx="40" cy="40" r="36" fill="url(#coinGrad)" stroke="#ca8a04" stroke-width="3" filter="url(#coinShadow)"/>
  <circle cx="40" cy="40" r="28" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-dasharray="4,2"/>
  <text x="40" y="49" font-family="'Fredoka', sans-serif" font-weight="900" font-size="28" fill="#a16207" text-anchor="middle">×</text>
  <!-- Sparkle on coin rim -->
  <polygon points="22,18 24,22 28,24 24,26 22,30 20,26 16,24 20,22" fill="#ffffff"/>
