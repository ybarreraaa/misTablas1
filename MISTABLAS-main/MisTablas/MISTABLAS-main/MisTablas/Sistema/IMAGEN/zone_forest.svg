<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <linearGradient id="forestSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="zoneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Island -->
  <rect x="8" y="8" width="184" height="144" rx="28" fill="url(#forestSky)" stroke="#34d399" stroke-width="4" filter="url(#zoneGlow)"/>
  
  <!-- Lush Green Hills -->
  <path d="M12,120 Q50,80 100,105 Q150,85 188,125 L188,140 L12,140 Z" fill="#10b981"/>
  <path d="M12,130 Q60,100 120,120 Q160,110 188,135 L188,140 L12,140 Z" fill="#047857"/>

  <!-- Cute Trees -->
  <!-- Tree 1 -->
  <rect x="36" y="80" width="8" height="24" rx="3" fill="#78350f"/>
  <circle cx="40" cy="72" r="18" fill="#22c55e"/>
  <circle cx="34" cy="66" r="10" fill="#4ade80"/>

  <!-- Tree 2 -->
  <rect x="156" y="75" width="8" height="26" rx="3" fill="#78350f"/>
  <circle cx="160" cy="65" r="20" fill="#16a34a"/>
  <circle cx="166" cy="60" r="12" fill="#86efac"/>

  <!-- Central Mascot Silhouette / Sparkle (Chispa y Fuchy) -->
  <g transform="translate(75, 45)">
    <circle cx="25" cy="30" r="24" fill="#fef08a" stroke="#eab308" stroke-width="3"/>
    <text x="25" y="38" font-size="24" text-anchor="middle">🦊</text>
    <polygon points="45,15 48,22 55,24 48,26 45,33 42,26 35,24 42,22" fill="#f59e0b"/>
  </g>

  <!-- Zone Title Badge -->
  <rect x="25" y="112" width="150" height="28" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="100" y="131" font-family="'Fredoka', sans-serif" font-weight="900" font-size="12" fill="#065f46" text-anchor="middle">
    BOSQUE DEL 2 Y 3
  </text>
</svg>
