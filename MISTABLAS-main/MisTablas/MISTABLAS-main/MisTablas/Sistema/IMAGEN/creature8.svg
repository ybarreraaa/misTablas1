<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Panda-Bambú (Tabla del 8) -->
  <defs>
    <radialGradient id="pandaBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="pandaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f766e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="70" cy="70" r="62" fill="#ecfdf5" opacity="0.8"/>
  <circle cx="70" cy="70" r="56" fill="#d1fae5" opacity="0.5"/>

  <!-- Round Black Ears -->
  <circle cx="36" cy="40" r="18" fill="#1e293b"/>
  <circle cx="104" cy="40" r="18" fill="#1e293b"/>

  <!-- Chubby Panda Head -->
  <ellipse cx="70" cy="76" rx="44" ry="40" fill="url(#pandaBg)" stroke="#334155" stroke-width="3" filter="url(#pandaGlow)"/>

  <!-- Dark Eye Patches -->
  <ellipse cx="50" cy="72" rx="12" ry="14" fill="#1e293b" transform="rotate(-15 50 72)"/>
  <ellipse cx="90" cy="72" rx="12" ry="14" fill="#1e293b" transform="rotate(15 90 72)"/>

  <!-- Sparkly Anime Eyes -->
  <circle cx="52" cy="71" r="5" fill="#ffffff"/>
  <circle cx="53" cy="70" r="2.5" fill="#10b981"/>

  <circle cx="88" cy="71" r="5" fill="#ffffff"/>
  <circle cx="87" cy="70" r="2.5" fill="#10b981"/>

  <!-- Blush Cheeks -->
  <circle cx="40" cy="85" r="7" fill="#fb7185" opacity="0.8"/>
  <circle cx="100" cy="85" r="7" fill="#fb7185" opacity="0.8"/>

  <!-- Nose & Mouth -->
  <ellipse cx="70" cy="82" rx="5" ry="3.5" fill="#1e293b"/>
  <path d="M65,86 Q70,90 75,86" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cute Green Bamboo Stick with 8 segments -->
  <g transform="translate(64, 95)">
    <rect x="0" y="0" width="12" height="26" rx="3" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
    <line x1="0" y1="9" x2="12" y2="9" stroke="#047857" stroke-width="2"/>
    <line x1="0" y1="18" x2="12" y2="18" stroke="#047857" stroke-width="2"/>
    <!-- Small Leaf -->
    <path d="M12,5 Q20,2 18,10 Q14,8 12,5 Z" fill="#34d399"/>
  </g>
</svg>
