<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Treasure Chest -->
  <defs>
    <linearGradient id="chestWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <!-- Base box -->
  <rect x="15" y="45" width="70" height="42" rx="6" fill="url(#chestWood)" stroke="#451a03" stroke-width="3"/>
  <rect x="18" y="45" width="10" height="42" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
  <rect x="72" y="45" width="10" height="42" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
  
  <!-- Curved Lid -->
  <path d="M12,45 C12,20 88,20 88,45 Z" fill="#d97706" stroke="#451a03" stroke-width="3"/>
  <path d="M16,45 C16,24 28,24 28,45 Z" fill="#facc15"/>
  <path d="M72,45 C72,24 84,24 84,45 Z" fill="#facc15"/>

  <!-- Golden Lock with Keyhole -->
  <rect x="42" y="40" width="16" height="18" rx="4" fill="#facc15" stroke="#b45309" stroke-width="2"/>
  <circle cx="50" cy="47" r="2.5" fill="#1e1b4b"/>
  <polygon points="49,47 51,47 52,53 48,53" fill="#1e1b4b"/>

  <!-- Sparkles -->
  <polygon points="85,15 88,21 94,23 88,25 85,31 82,25 76,23 82,21" fill="#facc15"/>
</svg>
