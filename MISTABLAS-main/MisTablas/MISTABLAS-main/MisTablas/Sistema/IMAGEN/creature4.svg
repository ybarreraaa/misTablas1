<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <radialGradient id="pengBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
    <filter id="pengGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Aura Background -->
  <circle cx="70" cy="70" r="62" fill="#eff6ff" opacity="0.8"/>
  <circle cx="70" cy="70" r="56" fill="#dbeafe" opacity="0.5"/>

  <!-- Round Head & Body -->
  <ellipse cx="70" cy="74" rx="42" ry="44" fill="url(#pengBg)" stroke="#1d4ed8" stroke-width="3" filter="url(#pengGlow)"/>

  <!-- Flippers / Little Wings -->
  <path d="M28,82 C16,84 18,104 32,98 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M112,82 C124,84 122,104 108,98 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>

  <!-- White Face Mask / Belly Shape -->
  <path d="M42,54 C42,42 56,42 70,52 C84,42 98,42 98,54 C98,82 92,106 70,106 C48,106 42,82 42,54 Z" fill="#ffffff"/>

  <!-- Cute Rosy Cheeks -->
  <circle cx="48" cy="76" r="8" fill="#fda4af" opacity="0.85"/>
  <circle cx="92" cy="76" r="8" fill="#fda4af" opacity="0.85"/>

  <!-- Big Shiny Anime Eyes (Happy curves like reference image!) -->
  <path d="M48,68 Q54,60 60,68" fill="none" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round"/>
  <path d="M80,68 Q86,60 92,68" fill="none" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round"/>

  <!-- Cute Yellow Beak -->
  <path d="M62,72 Q70,66 78,72 Q70,82 62,72 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <path d="M64,74 Q70,78 76,74" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>

  <!-- Little Head Fluff / Feather Crown -->
  <path d="M66,32 Q70,22 74,32" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>

  <!-- Holding Cute Red Pencil & Math Notebook (like reference image!) -->
  <g transform="translate(42, 98)">
    <!-- Open Mini Notebook -->
    <rect x="8" y="0" width="40" height="24" rx="3" fill="#38bdf8"/>
    <rect x="10" y="2" width="18" height="20" rx="1.5" fill="#f8fafc"/>
    <rect x="28" y="2" width="18" height="20" rx="1.5" fill="#f8fafc"/>
    <line x1="28" y1="2" x2="28" y2="22" stroke="#0284c7" stroke-width="1.5"/>
    <text x="14" y="15" font-size="8" font-family="'Fredoka', sans-serif" font-weight="900" fill="#1d4ed8">×4</text>
    <text x="32" y="15" font-size="8" font-family="'Fredoka', sans-serif" font-weight="900" fill="#f43f5e">⭐</text>
  </g>

  <!-- Cute Red Pencil -->
  <g transform="translate(34, 88) rotate(-40)">
    <rect x="0" y="0" width="6" height="20" rx="2" fill="#ef4444"/>
    <polygon points="0,20 6,20 3,26" fill="#fde047"/>
    <polygon points="1.5,23 4.5,23 3,26" fill="#1e1b4b"/>
  </g>

  <!-- Little Orange Feet -->
  <ellipse cx="55" cy="116" rx="9" ry="5" fill="#f59e0b"/>
  <ellipse cx="85" cy="116" rx="9" ry="5" fill="#f59e0b"/>

  <!-- Sparkles -->
  <polygon points="22,34 24,39 29,41 24,43 22,48 20,43 15,41 20,39" fill="#38bdf8"/>
  <polygon points="118,30 120,35 125,37 120,39 118,44 116,39 111,37 116,35" fill="#38bdf8"/>
</svg>
