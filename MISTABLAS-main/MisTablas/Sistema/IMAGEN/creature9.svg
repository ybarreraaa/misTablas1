<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Buhito-Sabio (Tabla del 9) -->
  <defs>
    <radialGradient id="owlBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="owlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#a16207" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="70" cy="70" r="62" fill="#fffbeb" opacity="0.8"/>
  <circle cx="70" cy="70" r="56" fill="#fef3c7" opacity="0.5"/>

  <!-- Feather Tuft Ears -->
  <polygon points="40,46 32,18 56,36" fill="#ca8a04"/>
  <polygon points="100,46 108,18 84,36" fill="#ca8a04"/>

  <!-- Round Body -->
  <ellipse cx="70" cy="76" rx="42" ry="40" fill="url(#owlBg)" stroke="#a16207" stroke-width="3" filter="url(#owlGlow)"/>

  <!-- Huge Kawaii Eyes Rings -->
  <circle cx="50" cy="68" r="18" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
  <circle cx="90" cy="68" r="18" fill="#ffffff" stroke="#eab308" stroke-width="2"/>

  <!-- Big Sparkly Eyes -->
  <circle cx="50" cy="68" r="10" fill="#1e1b4b"/>
  <circle cx="53" cy="65" r="4" fill="#ffffff"/>
  <circle cx="47" cy="71" r="1.5" fill="#facc15"/>

  <circle cx="90" cy="68" r="10" fill="#1e1b4b"/>
  <circle cx="93" cy="65" r="4" fill="#ffffff"/>
  <circle cx="87" cy="71" r="1.5" fill="#facc15"/>

  <!-- Orange Beak -->
  <polygon points="70,72 64,84 76,84" fill="#ea580c"/>

  <!-- Cheeks -->
  <circle cx="36" cy="80" r="7" fill="#fb7185" opacity="0.8"/>
  <circle cx="104" cy="80" r="7" fill="#fb7185" opacity="0.8"/>

  <!-- Graduation Mini-Cap with Tassel -->
  <g transform="translate(70, 26)">
    <polygon points="0,-10 -22,0 0,10 22,0" fill="#1e1b4b"/>
    <rect x="-10" y="3" width="20" height="7" rx="2" fill="#1e1b4b"/>
    <line x1="0" y1="0" x2="16" y2="6" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="16" cy="8" r="2.5" fill="#f59e0b"/>
  </g>

  <!-- Golden 9 Emblem on Chest -->
  <circle cx="70" cy="102" r="10" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="70" y="106" font-size="11" font-family="'Fredoka', sans-serif" font-weight="900" fill="#a16207" text-anchor="middle">9</text>
</svg>
