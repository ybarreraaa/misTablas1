<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Panda-Ninja -->
  <defs>
    <radialGradient id="pandaBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#pandaBg)"/>
  <!-- Ears -->
  <circle cx="28" cy="28" r="12" fill="#1e293b"/>
  <circle cx="72" cy="28" r="12" fill="#1e293b"/>
  <!-- Head -->
  <ellipse cx="50" cy="54" rx="30" ry="26" fill="#f8fafc"/>
  <!-- Ninja Headband -->
  <path d="M20,40 Q50,34 80,40 L80,48 Q50,42 20,48 Z" fill="#dc2626"/>
  <!-- Headband knot -->
  <circle cx="20" cy="45" r="4" fill="#b91c1c"/>
  <path d="M18,48 L10,58 L14,60 L20,50 Z" fill="#dc2626"/>
  <!-- Eye patches -->
  <ellipse cx="36" cy="55" rx="8" ry="7" fill="#1e293b" transform="rotate(-15 36 55)"/>
  <ellipse cx="64" cy="55" rx="8" ry="7" fill="#1e293b" transform="rotate(15 64 55)"/>
  <circle cx="37" cy="54" r="2.5" fill="#ffffff"/>
  <circle cx="63" cy="54" r="2.5" fill="#ffffff"/>
  <!-- Nose and mouth -->
  <ellipse cx="50" cy="65" rx="4" ry="3" fill="#1e293b"/>
  <path d="M46,69 Q50,73 54,69" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
</svg>
