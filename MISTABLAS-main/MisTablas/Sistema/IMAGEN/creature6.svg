<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Axo-Rosa (Cute Axolotl Kawaii for Tabla del 6) -->
  <defs>
    <radialGradient id="axoBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </radialGradient>
    <filter id="axoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#be185d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="70" cy="70" r="62" fill="#fdf2f8" opacity="0.8"/>
  <circle cx="70" cy="70" r="56" fill="#fce7f3" opacity="0.5"/>

  <!-- Frilly Axolotl Gills (3 on left, 3 on right -> 6 total!) -->
  <path d="M26,52 Q10,40 18,34 Q28,42 32,54 Z" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
  <path d="M22,66 Q4,60 12,52 Q24,58 28,68 Z" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
  <path d="M25,80 Q8,82 14,72 Q24,72 30,82 Z" fill="#ec4899" stroke="#be185d" stroke-width="2"/>

  <path d="M114,52 Q130,40 122,34 Q112,42 108,54 Z" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
  <path d="M118,66 Q136,60 128,52 Q116,58 112,68 Z" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
  <path d="M115,80 Q132,82 126,72 Q116,72 110,82 Z" fill="#ec4899" stroke="#be185d" stroke-width="2"/>

  <!-- Head/Body -->
  <ellipse cx="70" cy="75" rx="44" ry="36" fill="url(#axoBg)" stroke="#db2777" stroke-width="3" filter="url(#axoGlow)"/>

  <!-- Big Cheeks -->
  <circle cx="42" cy="80" r="9" fill="#f43f5e" opacity="0.8"/>
  <circle cx="98" cy="80" r="9" fill="#f43f5e" opacity="0.8"/>

  <!-- Big Sparkly Eyes -->
  <ellipse cx="52" cy="70" rx="7.5" ry="9" fill="#1e1b4b"/>
  <circle cx="54" cy="67" r="3.5" fill="#ffffff"/>
  <circle cx="50" cy="73" r="1.5" fill="#ffffff"/>

  <ellipse cx="88" cy="70" rx="7.5" ry="9" fill="#1e1b4b"/>
  <circle cx="90" cy="67" r="3.5" fill="#ffffff"/>
  <circle cx="86" cy="73" r="1.5" fill="#ffffff"/>

  <!-- Sweet Cat-like Mouth :3 -->
  <path d="M64,78 Q67,82 70,78 Q73,82 76,78" fill="none" stroke="#831843" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Holding Flower with 6 Petals -->
  <g transform="translate(62, 92)">
    <circle cx="8" cy="8" r="5" fill="#facc15"/>
    <circle cx="8" cy="0" r="4" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="16" cy="4" r="4" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="16" cy="12" r="4" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="8" cy="16" r="4" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="0" cy="12" r="4" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="0" cy="4" r="4" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/>
  </g>
</svg>
