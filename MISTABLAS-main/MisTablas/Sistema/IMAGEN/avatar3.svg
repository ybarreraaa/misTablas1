<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Robot-Calc -->
  <defs>
    <radialGradient id="robBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#robBg)"/>
  <!-- Antenna -->
  <line x1="50" y1="22" x2="50" y2="12" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="50" cy="10" r="6" fill="#f43f5e"/>
  <!-- Ears / Bolts -->
  <rect x="20" y="44" width="8" height="14" rx="3" fill="#94a3b8"/>
  <rect x="72" y="44" width="8" height="14" rx="3" fill="#94a3b8"/>
  <!-- Head -->
  <rect x="26" y="24" width="48" height="46" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
  <!-- Visor / Screen -->
  <rect x="32" y="32" width="36" height="20" rx="8" fill="#0f172a"/>
  <!-- Glowing Digital Eyes -->
  <circle cx="42" cy="42" r="4.5" fill="#22c55e"/>
  <circle cx="58" cy="42" r="4.5" fill="#22c55e"/>
  <!-- Calculator Screen Mouth -->
  <rect x="36" y="58" width="28" height="6" rx="3" fill="#38bdf8"/>
  <text x="50" y="63" fill="#ffffff" font-size="6" font-family="monospace" font-weight="900" text-anchor="middle">1 2 3 ×</text>
</svg>
