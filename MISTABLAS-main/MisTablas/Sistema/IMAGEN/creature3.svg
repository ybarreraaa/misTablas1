<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <radialGradient id="foxBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="70%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <filter id="foxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#c2410c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Aura Background -->
  <circle cx="70" cy="70" r="62" fill="#ffedd5" opacity="0.8"/>
  <circle cx="70" cy="70" r="56" fill="#fed7aa" opacity="0.5"/>

  <!-- Big Fluffy Fox Ears -->
  <polygon points="35,60 25,20 58,42" fill="#ea580c" stroke="#9a3412" stroke-width="2.5"/>
  <polygon points="36,54 30,28 50,44" fill="#ffedd5"/>

  <polygon points="105,60 115,20 82,42" fill="#ea580c" stroke="#9a3412" stroke-width="2.5"/>
  <polygon points="104,54 110,28 90,44" fill="#ffedd5"/>

  <!-- Fluffy Fox Tail behind -->
  <path d="M100,90 C125,90 135,115 110,125 C95,130 90,110 100,90 Z" fill="#ea580c"/>
  <path d="M120,110 C125,115 115,125 110,125 C105,125 110,115 120,110 Z" fill="#ffffff"/>

  <!-- Head Shape -->
  <ellipse cx="70" cy="78" rx="42" ry="36" fill="url(#foxBg)" stroke="#c2410c" stroke-width="3" filter="url(#foxGlow)"/>

  <!-- White Fluffy Cheeks -->
  <path d="M30,85 Q48,65 70,82 Q92,65 110,85 Q92,105 70,95 Q48,105 30,85 Z" fill="#ffffff"/>

  <!-- Cute Green Leaf on Head (like reference image fox!) -->
  <g transform="translate(42, 28) rotate(-20)">
    <path d="M12,0 C24,4 28,18 20,26 C12,18 8,4 12,0 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
    <line x1="16" y1="6" x2="18" y2="22" stroke="#15803d" stroke-width="1.5"/>
  </g>

  <!-- Big Shiny Anime Eyes (Winking or wide open and happy) -->
  <ellipse cx="52" cy="74" rx="7" ry="8.5" fill="#1e1b4b"/>
  <circle cx="54" cy="71" r="3.2" fill="#ffffff"/>
  <circle cx="50" cy="77" r="1.3" fill="#ffffff"/>

  <ellipse cx="88" cy="74" rx="7" ry="8.5" fill="#1e1b4b"/>
  <circle cx="90" cy="71" r="3.2" fill="#ffffff"/>
  <circle cx="86" cy="77" r="1.3" fill="#ffffff"/>

  <!-- Soft Pink Blush -->
  <ellipse cx="44" cy="85" rx="8" ry="5" fill="#f43f5e" opacity="0.6"/>
  <ellipse cx="96" cy="85" rx="8" ry="5" fill="#f43f5e" opacity="0.6"/>

  <!-- Tiny Cute Nose -->
  <circle cx="70" cy="81" r="3.5" fill="#1e1b4b"/>

  <!-- Cute Open Smile -->
  <path d="M64,86 Q70,93 76,86" fill="#f43f5e" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>

  <!-- Holding a cute Green Book (like reference image!) -->
  <g transform="translate(48, 96)">
    <rect x="0" y="4" width="44" height="26" rx="4" fill="#15803d"/>
    <rect x="2" y="6" width="20" height="22" rx="2" fill="#f8fafc"/>
    <rect x="22" y="6" width="20" height="22" rx="2" fill="#f8fafc"/>
    <path d="M22,4 L22,28" stroke="#166534" stroke-width="2"/>
    <!-- Cute leaf icon on book -->
    <path d="M12,14 Q16,10 16,16 Q12,18 12,14 Z" fill="#22c55e"/>
    <text x="32" y="21" font-size="9" font-family="'Fredoka', sans-serif" font-weight="900" fill="#ea580c">×3</text>
  </g>

  <!-- Tiny Paws resting on book -->
  <ellipse cx="48" cy="100" rx="6" ry="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <ellipse cx="92" cy="100" rx="6" ry="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
</svg>
