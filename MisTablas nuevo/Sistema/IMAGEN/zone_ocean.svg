<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <linearGradient id="oceanSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="oceanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="184" height="144" rx="28" fill="url(#oceanSky)" stroke="#38bdf8" stroke-width="4" filter="url(#oceanGlow)"/>
  
  <!-- Waves -->
  <path d="M12,95 Q50,75 90,95 Q130,115 188,90 L188,140 L12,140 Z" fill="#0284c7"/>
  <path d="M12,110 Q50,90 100,110 Q150,130 188,105 L188,140 L12,140 Z" fill="#0369a1"/>

  <!-- Axo / Gati-Cósmico Cute Island -->
  <ellipse cx="100" cy="75" rx="35" ry="14" fill="#fef08a"/>
  <circle cx="100" cy="55" r="22" fill="#fdf2f8" stroke="#f472b6" stroke-width="2.5"/>
  <text x="100" y="63" font-size="22" text-anchor="middle">🌸</text>

  <!-- Starfish and shells -->
  <polygon points="150,118 153,124 160,125 155,130 157,137 150,133 143,137 145,130 140,125 147,124" fill="#f43f5e"/>

  <!-- Zone Title Badge -->
  <rect x="25" y="112" width="150" height="28" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="100" y="131" font-family="'Fredoka', sans-serif" font-weight="900" font-size="12" fill="#0369a1" text-anchor="middle">
    OCÉANO DEL 6 Y 7
  </text>
</svg>
