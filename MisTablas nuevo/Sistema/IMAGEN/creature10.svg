<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Estrellín-Solar (Jirachi/Star style for Tabla del 10) -->
  <defs>
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="70" cy="70" r="62" fill="#eff6ff" opacity="0.8"/>
  <circle cx="70" cy="70" r="56" fill="#e0f2fe" opacity="0.5"/>

  <!-- Rainbow Pastel Ribbons Behind -->
  <path d="M40,90 Q20,115 35,125 Q50,110 45,95 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M100,90 Q120,115 105,125 Q90,110 95,95 Z" fill="#ec4899" opacity="0.8"/>

  <!-- 5-Pointed Star Head Shape -->
  <polygon points="70,14 84,48 120,52 94,76 102,112 70,94 38,112 46,76 20,52 56,48" 
           fill="url(#starGrad)" stroke="#d97706" stroke-width="3" filter="url(#starGlow)"/>

  <!-- Cute Big Shiny Eyes -->
  <ellipse cx="56" cy="68" rx="6.5" ry="8" fill="#1e1b4b"/>
  <circle cx="58" cy="65" r="3.2" fill="#ffffff"/>
  <circle cx="54" cy="71" r="1.3" fill="#38bdf8"/>

  <ellipse cx="84" cy="68" rx="6.5" ry="8" fill="#1e1b4b"/>
  <circle cx="86" cy="65" r="3.2" fill="#ffffff"/>
  <circle cx="82" cy="71" r="1.3" fill="#38bdf8"/>

  <!-- Bright Pink Rosy Cheeks -->
  <circle cx="48" cy="76" r="6" fill="#f43f5e" opacity="0.85"/>
  <circle cx="92" cy="76" r="6" fill="#f43f5e" opacity="0.85"/>

  <!-- Cute Open Smile -->
  <path d="M65,76 Q70,82 75,76" fill="#dc2626" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>

  <!-- 10 Badge in Forehead -->
  <g transform="translate(62, 38)">
    <rect x="0" y="0" width="16" height="12" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
    <text x="8" y="9" font-size="8" font-family="'Fredoka', sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle">10</text>
  </g>

  <!-- Sparkles -->
  <polygon points="18,22 21,28 27,30 21,32 18,38 15,32 9,30 15,28" fill="#facc15"/>
  <polygon points="122,26 124,31 129,33 124,35 122,40 120,35 115,33 120,31" fill="#facc15"/>
</svg>
