<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="cloudShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="purpleRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Big Soft Cloud Shape Container (like reference image top title!) -->
  <path d="M 60,65 
           A 35,35 0 0,1 95,20 
           A 42,42 0 0,1 160,12 
           A 45,45 0 0,1 230,6 
           A 45,45 0 0,1 300,12 
           A 42,42 0 0,1 365,20 
           A 35,35 0 0,1 400,65 
           A 32,32 0 0,1 380,105 
           L 80,105 
           A 32,32 0 0,1 60,65 Z" 
        fill="#ffffff" stroke="#e0e7ff" stroke-width="4" filter="url(#cloudShadow)"/>

  <!-- Golden Star on top apex of cloud -->
  <polygon points="230,-2 234,8 245,10 236,18 239,28 230,22 221,28 224,18 215,10 226,8" 
           fill="#facc15" stroke="#eab308" stroke-width="1.5"/>

  <!-- Sparkles around cloud -->
  <polygon points="65,15 67,20 72,21 67,23 65,28 63,23 58,21 63,20" fill="#f59e0b"/>
  <polygon points="395,15 397,20 402,21 397,23 395,28 393,23 388,21 393,20" fill="#f59e0b"/>
  <polygon points="415,65 417,70 422,71 417,73 415,78 413,73 408,71 413,70" fill="#38bdf8"/>
  <polygon points="45,65 47,70 52,71 47,73 45,78 43,73 38,71 43,70" fill="#ec4899"/>

  <!-- Rainbow Kawaii Title: "¡Mis Tablas en 4° Básico!" -->
  <g font-family="'Fredoka', 'Quicksand', sans-serif" font-weight="900" font-size="34" letter-spacing="1">
    <!-- ¡ (Pink) -->
    <text x="75" y="58" fill="#f43f5e">¡</text>
    <!-- M (Red/Orange) -->
    <text x="90" y="58" fill="#f97316">M</text>
    <!-- i (Amber) -->
    <text x="122" y="58" fill="#f59e0b">i</text>
    <!-- s (Green) -->
    <text x="134" y="58" fill="#10b981">s</text>
    <!-- Space -->
    <!-- T (Teal) -->
    <text x="160" y="58" fill="#06b6d4">T</text>
    <!-- a (Sky Blue) -->
    <text x="183" y="58" fill="#38bdf8">a</text>
    <!-- b (Indigo) -->
    <text x="204" y="58" fill="#6366f1">b</text>
    <!-- l (Purple) -->
    <text x="226" y="58" fill="#8b5cf6">l</text>
    <!-- a (Pink) -->
    <text x="238" y="58" fill="#ec4899">a</text>
    <!-- s (Rose) -->
    <text x="259" y="58" fill="#f43f5e">s</text>
    
    <!-- en (Dark Purple/Navy) -->
    <text x="284" y="58" font-size="28" fill="#1e1b4b"> en </text>
    
    <!-- 4° Básico! (Warm Rainbow) -->
    <text x="328" y="58" fill="#2563eb">4</text>
    <text x="348" y="58" fill="#eab308">°</text>
    <text x="360" y="58" fill="#10b981">!</text>
  </g>

  <!-- Cute Purple/Lavender Ribbon below title (like reference image!) -->
  <g transform="translate(100, 72)">
    <rect x="0" y="0" width="260" height="28" rx="14" fill="url(#purpleRibbon)"/>
    <text x="130" y="19" font-family="'Quicksand', 'Nunito', sans-serif" font-weight="800" font-size="12.5" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      AVENTURA MATEMÁTICA Y TABLAS 4° BÁSICO
    </text>
  </g>
</svg>
