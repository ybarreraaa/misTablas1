<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <radialGradient id="drakBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <filter id="drakGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#166534" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Aura Background -->
  <circle cx="70" cy="70" r="62" fill="#f0fdf4" opacity="0.8"/>
  <circle cx="70" cy="70" r="56" fill="#dcfce7" opacity="0.5"/>

  <!-- Cute Yellow Baby Dragon Wings -->
  <path d="M25,65 C10,50 15,35 34,42 C30,52 32,60 25,65 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <path d="M115,65 C130,50 125,35 106,42 C110,52 108,60 115,65 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>

  <!-- Golden Spikes along Head -->
  <polygon points="50,34 56,18 64,32" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <polygon points="65,30 70,14 76,30" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <polygon points="76,32 84,18 90,34" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>

  <!-- Dragon Chubby Head & Body -->
  <ellipse cx="70" cy="76" rx="42" ry="38" fill="url(#drakBg)" stroke="#15803d" stroke-width="3" filter="url(#drakGlow)"/>

  <!-- Light Green / Yellowish Belly -->
  <ellipse cx="70" cy="92" rx="24" ry="20" fill="#bbf7d0" opacity="0.9"/>

  <!-- Rosy Cheeks -->
  <circle cx="45" cy="80" r="8" fill="#fb7185" opacity="0.85"/>
  <circle cx="95" cy="80" r="8" fill="#fb7185" opacity="0.85"/>

  <!-- Big Shiny Anime Eyes (Excited!) -->
  <ellipse cx="54" cy="68" rx="8" ry="9.5" fill="#1e1b4b"/>
  <circle cx="56" cy="65" r="3.8" fill="#ffffff"/>
  <circle cx="52" cy="72" r="1.6" fill="#ffffff"/>

  <ellipse cx="86" cy="68" rx="8" ry="9.5" fill="#1e1b4b"/>
  <circle cx="88" cy="65" r="3.8" fill="#ffffff"/>
  <circle cx="84" cy="72" r="1.6" fill="#ffffff"/>

  <!-- Cute Dragon Snout with tiny nostrils -->
  <ellipse cx="70" cy="76" rx="16" ry="10" fill="#86efac"/>
  <circle cx="66" cy="74" r="1.8" fill="#15803d"/>
  <circle cx="74" cy="74" r="1.8" fill="#15803d"/>

  <!-- Huge Happy Smile with cute baby tooth -->
  <path d="M60,80 Q70,92 80,80" fill="#dc2626" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="64,80 68,80 66,84" fill="#ffffff"/>

  <!-- Raising Cute Little Paw in Victory (like reference image!) -->
  <ellipse cx="36" cy="62" rx="8" ry="10" fill="#4ade80" stroke="#15803d" stroke-width="2"/>

  <!-- Holding Open Purple Book (like reference image!) -->
  <g transform="translate(68, 96)">
    <rect x="0" y="4" width="38" height="24" rx="3" fill="#8b5cf6"/>
    <rect x="2" y="6" width="16" height="20" rx="1.5" fill="#f8fafc"/>
    <rect x="20" y="6" width="16" height="20" rx="1.5" fill="#f8fafc"/>
    <line x1="19" y1="4" x2="19" y2="28" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="23" y="19" font-size="9" font-family="'Fredoka', sans-serif" font-weight="900" fill="#15803d">×5</text>
  </g>
  <ellipse cx="74" cy="102" rx="6" ry="5" fill="#4ade80" stroke="#15803d" stroke-width="1.5"/>

  <!-- Little Golden Star over head -->
  <polygon points="70,0 73,7 81,8 75,13 77,21 70,17 63,21 65,13 59,8 67,7" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
</svg>
