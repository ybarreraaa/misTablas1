<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dragón-Chispa -->
  <defs>
    <radialGradient id="dragBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#dragBg)"/>
  <!-- Horns -->
  <path d="M30,30 Q24,14 36,18 Q34,26 38,32 Z" fill="#fbbf24"/>
  <path d="M70,30 Q76,14 64,18 Q66,26 62,32 Z" fill="#fbbf24"/>
  <!-- Head -->
  <ellipse cx="50" cy="54" rx="28" ry="24" fill="#fda4af"/>
  <!-- Snout -->
  <ellipse cx="50" cy="62" rx="16" ry="12" fill="#fff1f2"/>
  <circle cx="45" cy="60" r="2.5" fill="#e11d48"/>
  <circle cx="55" cy="60" r="2.5" fill="#e11d48"/>
  <!-- Eyes -->
  <ellipse cx="40" cy="46" rx="5" ry="6" fill="#1e1b4b"/>
  <circle cx="42" cy="44" r="2" fill="#ffffff"/>
  <ellipse cx="60" cy="46" rx="5" ry="6" fill="#1e1b4b"/>
  <circle cx="62" cy="44" r="2" fill="#ffffff"/>
  <!-- Little fire puff from snout -->
  <polygon points="50,68 46,78 54,78" fill="#f59e0b"/>
  <polygon points="50,68 48,74 52,74" fill="#fef08a"/>
</svg>
