<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dino-Genio -->
  <defs>
    <radialGradient id="dinoBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#dinoBg)"/>
  <!-- Spikes on back/head -->
  <polygon points="26,24 34,14 40,26" fill="#fbbf24"/>
  <polygon points="40,20 48,10 54,22" fill="#fbbf24"/>
  <polygon points="56,22 64,12 68,26" fill="#fbbf24"/>
  <!-- Head shape -->
  <path d="M28,68 C28,40 44,28 66,32 C78,34 84,46 78,58 C72,66 64,74 44,74 C34,74 28,70 28,68 Z" fill="#10b981"/>
  <!-- Belly / cheek light spot -->
  <circle cx="68" cy="56" r="6" fill="#6ee7b7" opacity="0.6"/>
  <!-- Glasses -->
  <rect x="42" y="38" width="16" height="14" rx="4" fill="none" stroke="#1e293b" stroke-width="3"/>
  <rect x="62" y="38" width="16" height="14" rx="4" fill="none" stroke="#1e293b" stroke-width="3"/>
  <line x1="58" y1="44" x2="62" y2="44" stroke="#1e293b" stroke-width="3"/>
  <!-- Eyes inside glasses -->
  <circle cx="50" cy="45" r="3.5" fill="#1e293b"/>
  <circle cx="51" cy="44" r="1.2" fill="#ffffff"/>
  <circle cx="70" cy="45" r="3.5" fill="#1e293b"/>
  <circle cx="71" cy="44" r="1.2" fill="#ffffff"/>
  <!-- Friendly smile with tooth -->
  <path d="M50,62 Q60,68 68,60" fill="none" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="58,62 62,62 60,65" fill="#ffffff"/>
</svg>
