<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <linearGradient id="volcanoSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="volcanoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#ea580c" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Island -->
  <rect x="8" y="8" width="184" height="144" rx="28" fill="url(#volcanoSky)" stroke="#fb923c" stroke-width="4" filter="url(#volcanoGlow)"/>
  
  <!-- Volcano Mountain Shape -->
  <polygon points="100,35 155,125 45,125" fill="#7c2d12"/>
  <polygon points="100,35 140,125 60,125" fill="#9a3412"/>
  <!-- Lava flow -->
  <path d="M88,38 Q100,55 96,75 Q104,95 102,120" stroke="#f97316" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M96,38 Q104,50 102,68" stroke="#facc15" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Lava Smoke Clouds -->
  <circle cx="92" cy="26" r="10" fill="#fed7aa" opacity="0.9"/>
  <circle cx="106" cy="22" r="14" fill="#ffedd5" opacity="0.9"/>
  <circle cx="120" cy="25" r="9" fill="#fed7aa" opacity="0.9"/>

  <!-- Mascot Symbol (Drako & Pingüi) -->
  <circle cx="45" cy="55" r="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
  <text x="45" y="62" font-size="18" text-anchor="middle">🐲</text>

  <!-- Zone Title Badge -->
  <rect x="25" y="112" width="150" height="28" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="100" y="131" font-family="'Fredoka', sans-serif" font-weight="900" font-size="12" fill="#9a3412" text-anchor="middle">
    VOLCÁN DEL 4 Y 5
  </text>
</svg>
